name: Build Page

# The live site is gh-pages, and `mkdocs gh-deploy` rewrites it. Only a push
# to master (or a manual dispatch) deploys; a pull request builds the site
# with --strict and deploys nothing. Before this filter every branch push
# deployed: on 2026-09-18 two pushes of docs/quickstart-verified-master
# published an unmerged branch, and master was redeployed by hand each time.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force --clean --verbose
